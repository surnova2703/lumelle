<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Lumelle AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0.25' stop-color='%23FFF4DD'/%3E%3Cstop offset='0.6' stop-color='%23F2B45A'/%3E%3Cstop offset='1' stop-color='%23F2B45A' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%2314162B'/%3E%3Ccircle cx='32' cy='32' r='26' fill='url(%23g)'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-title" content="Lumelle AI">
<style>
  :root {
    --bg: #F6F3EC;
    --panel: #FFFDF8;
    --ink: #14162B;
    --muted: #6B6E85;
    --line: #E4DFD3;
    --side: #14162B;
    --side-ink: #E9E7F2;
    --side-muted: #9A9CB8;
    --side-hover: #22254A;
    --accent: #F2B45A;
    --accent-ink: #14162B;
    --user: #14162B;
    --user-ink: #F6F3EC;
    --bot: #FFFDF8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1124;
      --panel: #181B35;
      --ink: #ECEAF4;
      --muted: #9A9CB8;
      --line: #2A2D4D;
      --side: #0B0D1C;
      --side-hover: #1C1F3D;
      --user: #F2B45A;
      --user-ink: #14162B;
      --bot: #1C1F3D;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--ink);
    height: 100vh; height: 100dvh; overflow: hidden;
    display: grid; grid-template-columns: 280px minmax(0, 1fr);
  }
  body.side-closed { grid-template-columns: minmax(0, 1fr); }
  body.side-closed aside { display: none; }

  /* ---------- боковая панель ---------- */
  aside {
    background: var(--side); color: var(--side-ink);
    display: flex; flex-direction: column; min-height: 0;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 20px 12px 12px 20px; font-weight: 700; font-size: 20px; }
  .brand .name { flex: 1; }
  .icon-btn {
    width: 36px; height: 36px; flex: none; display: grid; place-items: center;
    border: 0; border-radius: 8px; background: none; color: inherit; cursor: pointer;
  }
  .icon-btn:hover { background: var(--side-hover); }
  .icon-btn svg { width: 20px; height: 20px; }
  .scrim { display: none; }
  .orb { width: 22px; height: 22px; border-radius: 50%;
         background: radial-gradient(circle, #FFF4DD 0 25%, #F2B45A 55%, rgba(242,180,90,0) 72%); }
  .new-chat {
    margin: 4px 16px 12px; padding: 11px 14px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer;
  }
  .new-chat:hover { filter: brightness(1.05); }
  .chat-list { list-style: none; margin: 0; padding: 0 8px 16px; overflow-y: auto; flex: 1; }
  .chat-item {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px;
    cursor: pointer; color: var(--side-ink);
  }
  .chat-item:hover { background: var(--side-hover); }
  .chat-item.active { background: var(--side-hover); box-shadow: inset 3px 0 0 var(--accent); }
  .chat-item .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .chat-item .tag { font-size: 11px; color: var(--side-muted); text-transform: uppercase; letter-spacing: .04em; }
  .chat-item .del { opacity: 0; border: 0; background: none; color: var(--side-muted); cursor: pointer; font-size: 16px; padding: 0 2px; }
  .chat-item:hover .del { opacity: 1; }
  .chat-item .del:hover { color: #FF9C8A; }
  .empty-list { padding: 12px; color: var(--side-muted); font-size: 14px; }
  .lang { position: relative; display: flex; align-items: center; gap: 8px; margin: 8px 16px 16px; padding: 0 12px; border: 1px solid var(--side-hover); border-radius: 8px; color: var(--side-muted); font-size: 13px; cursor: pointer; }
  .lang:hover { color: var(--side-ink); background: var(--side-hover); }
  .lang svg { width: 15px; height: 15px; flex: none; pointer-events: none; }
  .lang { min-height: 36px; justify-content: space-between; }
  /* список растянут на всю кнопку: открывается по клику в любом месте, в том числе по стрелке */
  .lang select { position: absolute; inset: 0; width: 100%; appearance: none; -webkit-appearance: none; border: 0; background: none; color: inherit; font: inherit; padding: 0 34px 0 35px; cursor: pointer; outline: none; }
  .lang:focus-within { border-color: var(--accent); }
  .lang select option { color: #14162B; background: #fff; }

  /* ---------- основная часть ---------- */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header {
    display: flex; align-items: center; gap: 16px; padding: 14px 24px;
    padding-top: max(14px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { flex: 1; margin: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .modes { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .modes button {
    border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px;
    padding: 6px 14px; border-radius: 7px; cursor: pointer;
  }
  .modes button.on { background: var(--ink); color: var(--bg); }
  .menu-btn { display: none; color: var(--ink); margin-left: -8px; }
  .menu-btn:hover { background: var(--bg); }
  body.side-closed .menu-btn { display: grid; }

  .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: min(760px, 88%); padding: 12px 16px; border-radius: 14px; line-height: 1.5; font-size: 15px; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-ink); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.assistant { align-self: flex-start; background: var(--bot); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.assistant p { margin: 0 0 8px; } .msg.assistant p:last-child { margin: 0; }
  .msg.assistant pre { background: var(--bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
  .msg.assistant code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }
  .msg.assistant ul, .msg.assistant ol { margin: 4px 0 8px; padding-left: 22px; }
  .msg.assistant a.dl {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; padding: 10px 16px; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink); font-weight: 600; text-decoration: none;
  }
  .msg.assistant a.dl:hover { filter: brightness(1.05); }
  .msg.error { align-self: flex-start; background: #FBE3DE; color: #7A2414; border: 1px solid #F0B7AA; }
  .typing { align-self: flex-start; color: var(--muted); font-size: 14px; padding: 4px 4px; }
  .typing span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .welcome { margin: auto; text-align: center; color: var(--muted); max-width: 420px; }
  .welcome .big-orb { width: 96px; height: 96px; margin: 0 auto 18px; border-radius: 50%;
    background: radial-gradient(circle, #FFF4DD 0 22%, #F2B45A 50%, rgba(242,180,90,0) 72%); }
  .welcome h2 { color: var(--ink); margin: 0 0 6px; font-size: 24px; }
  .welcome .pres { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }
  .welcome .pres a {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    font-size: 14px; font-weight: 600; text-decoration: none;
  }
  .welcome .pres a:hover { border-color: var(--accent); }
  .welcome .pres a.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .welcome .pres svg { width: 18px; height: 18px; flex: none; }
  .welcome .pres button { font: inherit; cursor: pointer; }
  .welcome .pres .pbtn {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 14px; font-weight: 600;
  }
  .welcome .pres .pbtn:hover { border-color: var(--accent); }
  .welcome .pres .pbtn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .welcome .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
  .welcome .chips[hidden] { display: none; }
  .welcome .chip { font: inherit; font-size: 13px; font-weight: 600; padding: 7px 13px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--accent); background: transparent; color: var(--ink); }
  .welcome .chip:hover { background: var(--accent); color: #14162B; }

  /* ---------- выбор языка презентации ---------- */
  .chooser { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(10,12,28,.55); }
  .chooser.open { display: flex; }
  .chooser-box {
    width: min(380px, 100%); background: var(--panel); color: var(--ink); border-radius: 18px; padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35); position: relative;
  }
  .chooser-box h3 { margin: 0 0 4px; font-size: 20px; }
  .chooser-box p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .chooser-box .close-x { position: absolute; top: 12px; right: 12px; color: var(--muted); }
  .chooser-box .close-x:hover { background: var(--bg); }
  .lang-opt {
    width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin-bottom: 10px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink);
    font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; text-align: left;
  }
  .lang-opt:hover { border-color: var(--accent); }
  .lang-opt .code { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--accent); font-size: 13px; font-weight: 700; flex: none; }
  .lang-opt .sub { display: block; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .lang-opt .code svg { width: 18px; height: 18px; }
  .back-btn { display: inline-flex; align-items: center; gap: 4px; margin: -6px 0 8px -6px; padding: 4px 8px 4px 4px; border: 0; border-radius: 8px; background: none; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; }
  .back-btn:hover { background: var(--bg); color: var(--ink); }
  .back-btn svg { width: 16px; height: 16px; }
  .tech-link { display: inline; padding: 0; border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .tech-link:hover { color: var(--ink); }

  /* ---------- вход и аккаунты ---------- */
  .login { position: fixed; inset: 0; z-index: 70; display: none; place-items: center; padding: 16px; overflow-y: auto;
    background: radial-gradient(1200px 600px at 50% -10%, #22254A 0, #14162B 60%); }
  body.need-login .login { display: grid; }
  .login-card { width: min(380px, 100%); background: #FFFDF8; color: #14162B; border-radius: 20px; padding: 32px 28px 26px;
    box-shadow: 0 24px 70px rgba(0,0,0,.4); text-align: center; position: relative; }
  .login-card .big-orb { width: 84px; height: 84px; margin: 0 auto 14px; border-radius: 50%;
    background: radial-gradient(circle, #FFF4DD 0 22%, #F2B45A 50%, rgba(242,180,90,0) 72%); }
  .login-card h1 { margin: 0; font-size: 24px; }
  .login-card .sub { margin: 6px 0 22px; color: #6B6E85; font-size: 14px; }
  .login-card .field { text-align: left; margin-bottom: 14px; }
  .login-card label.f { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .login-card input[type=text], .login-card input[type=password] { width: 100%; padding: 12px 14px; border: 1px solid #E4DFD3; border-radius: 12px;
    background: #F6F3EC; color: #14162B; font: inherit; font-size: 16px; outline: none; }
  .login-card input:focus { border-color: #F2B45A; box-shadow: 0 0 0 3px rgba(242,180,90,.25); }
  .login-card .pw { position: relative; }
  .login-card .pw input { padding-right: 96px; }
  .login-card .pw button { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: #6B6E85; cursor: pointer; font: inherit; font-size: 13px; }
  .login-card .remember { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #6B6E85; margin: 4px 0 18px; text-align: left; cursor: pointer; }
  .login-card .go { width: 100%; padding: 13px; border: 0; border-radius: 12px; background: #F2B45A; color: #14162B; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; }
  .login-card .go:disabled { opacity: .6; }
  .login-err { margin: -4px 0 14px; padding: 10px 12px; border-radius: 10px; background: #FBEBE6; color: #C2410C; font-size: 13px; text-align: left; }
  .login-card .foot { margin-top: 18px; font-size: 12px; color: #6B6E85; display: flex; justify-content: center; gap: 6px; align-items: center; }
  .login-card .foot svg { width: 14px; height: 14px; flex: none; }
  .login-lang { position: fixed; top: calc(16px + env(safe-area-inset-top)); right: 16px; color: #9A9CB8; font-size: 13px;
    border: 1px solid #22254A; border-radius: 8px; padding: 6px 10px; background: none; font-family: inherit; }
  .login-lang option { color: #14162B; }
  .me { margin: 8px 16px 0; padding: 8px 8px 8px 10px; border: 1px solid var(--side-hover); border-radius: 12px; display: flex; align-items: center; gap: 10px; }
  .me[hidden] { display: none; }
  .me .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #14162B; font-weight: 700; flex: none; }
  .me .who { flex: 1; min-width: 0; line-height: 1.2; }
  .me .who b { display: block; font-size: 14px; }
  .me .who span { font-size: 12px; color: var(--side-muted); }
  .me button { border: 0; background: none; color: var(--side-muted); cursor: pointer; font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 6px; }
  .me button:hover { background: var(--side-hover); color: var(--side-ink); }
  .users { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
  .u-row { display: grid; grid-template-columns: minmax(60px,1fr) 118px 52px minmax(90px,1.3fr) auto auto; gap: 8px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); font-size: 14px; }
  .u-row:first-child { border-top: 0; }
  .u-row.head { background: var(--bg); font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .u-row b { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
  .u-role { justify-self: start; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; }
  .u-role.admin { background: #FCEFD9; border-color: #F2B45A; color: #14162B; }
  .u-row input { min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; font-size: 13px; }
  .u-row button { padding: 8px 10px; border: 0; border-radius: 8px; background: var(--ink); color: var(--bg); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .u-row button.del { background: none; color: #C2410C; border: 1px solid var(--line); }
  .u-row button.del[disabled] { visibility: hidden; }
  .add-user { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) auto; gap: 8px; margin-bottom: 8px; }
  .add-user input { min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; }
  .add-user button { padding: 10px 16px; border: 0; border-radius: 10px; background: var(--accent); color: #14162B; font: inherit; font-weight: 700; cursor: pointer; }
  .must-input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); font: inherit; font-size: 16px; margin-bottom: 6px; }
  .must-go { width: 100%; padding: 12px; border: 0; border-radius: 12px; background: var(--accent); color: #14162B; font: inherit; font-weight: 700; cursor: pointer; margin-top: 6px; }
  @media (max-width: 560px) {
    .u-row { grid-template-columns: minmax(0,1fr) auto 40px; }
    .u-row.head span:nth-child(n+4) { display: none; }
    .u-row input { grid-column: 1 / 3; }
    .u-row button[data-act="pw"] { grid-column: 3 / 4; padding: 8px 4px; font-size: 0; }
    .u-row button[data-act="pw"]::after { content: "✓"; font-size: 16px; }
    .u-row button.del { grid-column: 1 / -1; justify-self: start; }
    .u-row button.del[disabled] { display: none; }
    .add-user { grid-template-columns: 1fr; }
  }
  .docs-btn { display: flex; align-items: center; gap: 8px; margin: -4px 16px 10px; padding: 9px 12px; border: 1px solid var(--side-hover); border-radius: 10px;
    background: none; color: var(--side-ink); font: inherit; font-size: 14px; cursor: pointer; text-align: left; }
  .docs-btn[hidden] { display: none; }
  .docs-btn:hover { background: var(--side-hover); }
  .docs-btn svg { width: 16px; height: 16px; flex: none; color: var(--accent); }
  .docs-count { margin-left: auto; font-size: 12px; color: var(--side-muted); }
  .doc-list { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
  .doc-list:empty { display: none; }
  .doc-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); font-size: 14px; }
  .doc-row:first-child { border-top: 0; }
  .doc-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-row .meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .doc-row button { border: 1px solid var(--line); background: none; color: #C2410C; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .docs-pick { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .docs-pick[hidden] { display: none; }
  .docs-pick select, .doc-bar select, .doc-row select { font: inherit; font-size: 13px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; max-width: 180px; }
  .docs-pick select[hidden], #strictLbl[hidden] { display: none; }
  .doc-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 14px; }
  .doc-bar label { display: flex; align-items: center; gap: 8px; }
  .doc-bar select { font-size: 14px; padding: 6px 8px; max-width: 240px; }
  .doc-row select { max-width: 130px; }
  .doc-sem { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--bg); font-size: 13px; color: var(--muted); line-height: 1.45; }
  .doc-sem:empty { display: none; }
  .doc-sem code { display: inline-block; margin-top: 4px; padding: 2px 6px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); user-select: all; }
  .doc-sem.on { color: var(--ink); }
  @media (max-width: 560px) { .doc-row { flex-wrap: wrap; } .doc-row .nm { flex-basis: 100%; } }
  .cloud-note { font-size: 12px; color: #B45309; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .cloud-note[hidden] { display: none; }
  .cloud-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .cloud-card .top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .cloud-card .top b { font-size: 16px; }
  .cloud-card .st { font-size: 12px; color: var(--muted); }
  .cloud-card .st.ok { color: #15803D; }
  .cloud-card .top a { margin-left: auto; font-size: 13px; color: var(--muted); }
  .cloud-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .cloud-row input, .cloud-row select { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; font-size: 13px; }
  .cloud-row button { padding: 8px 12px; border: 0; border-radius: 8px; background: var(--ink); color: var(--bg); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .cloud-row button.del { background: none; color: #C2410C; border: 1px solid var(--line); }

  .rec-time { position: absolute; bottom: -16px; left: 0; right: 0; font-size: 11px; color: #D9480F; font-variant-numeric: tabular-nums; }

// ---------- API ----------
async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...options,
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== "/login") { showLogin(); }
  if (!res.ok) {
    const err = new Error(typeof data.detail === "string" ? data.detail : `Ошибка ${res.status}`);
    err.status = res.status; err.detail = data.detail;
    throw err;
  }
  return data;
}

// ---------- простой markdown для ответов ----------
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function renderMarkdown(text) {
  const blocks = escapeHtml(text).split(/```/);
  return blocks.map((part, i) => {
    if (i % 2 === 1) return `<pre><code>${part.replace(/^\w*\n/, "")}</code></pre>`;
    return part.trim().split(/\n{2,}/).map((para) => {
      const inline = (s) => s
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
        .replace(/\[([^\]]+)\]\((\/decks\/lumelle_\d+\.pptx)\)/g, '<a class="dl" href="$2" download>$1</a>')
        .replace(/^#{1,6}\s+(.*)$/gm, "<b>$1</b>");
      const lines = para.split("\n");
      if (lines.every((l) => /^\s*[-*•]\s+/.test(l)))
        return "<ul>" + lines.map((l) => `<li>${inline(l.replace(/^\s*[-*•]\s+/, ""))}</li>`).join("") + "</ul>";
      if (lines.every((l) => /^\s*\d+[.)]\s+/.test(l)))
        return "<ol>" + lines.map((l) => `<li>${inline(l.replace(/^\s*\d+[.)]\s+/, ""))}</li>`).join("") + "</ol>";
      return para ? `<p>${inline(para).replace(/\n/g, "<br>")}</p>` : "";
    }).join("");
  }).join("");
}

function renderMessages(messages) {
  const box = $("messages");
  box.innerHTML = "";
  if (!messages.length) {
    box.innerHTML = welcomeHtml();
    return;
  }
  messages.forEach((m) => addMessage(m.role, m.content, false, m.images || []));
  box.scrollTop = box.scrollHeight;
}

function addMessage(role, content, scroll = true, images = []) {
  const box = $("messages");
  box.querySelector(".welcome")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + role;
  if (role === "assistant") {
    div.innerHTML = renderMarkdown(content);
    if ("speechSynthesis" in window && content) {
      const b = document.createElement("button");
      b.className = "say"; b.type = "button";
      b.innerHTML = SAY_ICON + `<span>${t("say")}</span>`;
      b.onclick = () => (tts.btn === b ? stopSpeaking() : speak(content, b));
      div.appendChild(b);
    }
  }
  else {
    if (images.length) {
      const wrap = document.createElement("div");
      wrap.className = "msg-images";
      for (const b64 of images) {
        const img = document.createElement("img");
        img.src = "data:image/jpeg;base64," + b64;
        img.alt = "";
        img.onclick = () => { $("lightImg").src = img.src; $("lightbox").classList.add("open"); };
        wrap.appendChild(img);
      }
      div.appendChild(wrap);
    }
    if (content) div.appendChild(document.createTextNode(content));
  }
  box.appendChild(div);
  if (scroll) box.scrollTop = box.scrollHeight;
  return div;
}

async function loadChats() {
  state.chats = await api("/chats");
  renderChatList();
}

async function openChat(id) {
  const chat = await api(`/chats/${id}`);
  state.current = chat;
  setMode(chat.mode);
  $("chatTitle").textContent = chat.title;
  renderMessages(chat.messages);
  renderChatList();
  document.body.classList.remove("menu-open");
  $("input").focus();
}

function newChat() {
  state.current = null;
  $("chatTitle").textContent = t("newChatTitle");
  renderMessages([]);
  renderChatList();
  document.body.classList.remove("menu-open");
  $("input").focus();
}

async function deleteChat(id) {
  if (!confirm(t("confirmDel"))) return;
  await api(`/chats/${id}`, { method: "DELETE" });
  if (state.current && state.current.id === id) newChat();
  await loadChats();
}

async function send(text, images = []) {
  setBusy(true);
  addMessage("user", text, true, images);
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.innerHTML = "<span></span><span></span><span></span> " + t("typing");
  $("messages").appendChild(typing);
  $("messages").scrollTop = $("messages").scrollHeight;

  try {
    if (!state.current) {
      const created = await api("/chats", { method: "POST", body: { mode: state.mode } });
      state.current = { id: created.id, mode: state.mode, title: "New chat" };
    }
    const res = await api(`/chats/${state.current.id}/ask`, {
      method: "POST",
      body: { text, images, think: $("think").checked, ui_lang: lang, ...docsRequest() },
    });
    typing.remove();
    const answerDiv = addMessage("assistant", res.answer);
    if ($("speakToggle").checked) speak(res.answer, answerDiv.querySelector(".say"));
    await loadChats();
    const fresh = state.chats.find((c) => c.id === state.current.id);
    if (fresh) { state.current.title = fresh.title; $("chatTitle").textContent = fresh.title; }
  } catch (err) {
    typing.remove();
    addMessage("error", t("error") + err.message + (/not available/i.test(err.message) ? t("errorHint") : ""));
  } finally {
    setBusy(false);
    $("input").focus();
  }
}

function updateCmdMenu() {
  const v = $("input").value;
  const m = /^\/([\p{L}\p{N}_-]*)$/u.exec(v);
  const menu = $("cmdMenu");
  if (!m) { menu.hidden = true; return; }
  const items = cmdItems(m[1]);
  cmdSel = Math.min(cmdSel, items.length - 1);
  menu.innerHTML = items.map((c, i) => `<div class="cmd-item${c.add ? " add" : ""}${i === cmdSel ? " on" : ""}" role="option" data-i="${i}">` +
    `<b>${c.add ? "+ " + escapeHtml(c.name) : "/" + escapeHtml(c.name)}</b><span class="d">${escapeHtml(c.desc)}</span>` +
    (c.own ? `<button type="button" class="x" data-del="${escapeHtml(c.name)}" title="${t("del")}">×</button>` : "") + "</div>").join("");
  menu.hidden = false;
  menu._items = items;

function pickCmd(i) {
  const c = $("cmdMenu")._items[i];
  $("cmdMenu").hidden = true;
  if (c.add) { openCmdDlg(); return; }
  $("input").value = "/" + c.name + " ";
  $("input").focus();

  const menu = $("cmdMenu");

let pending = []; // base64 без префикса

// уменьшаем картинку до 1600 px по длинной стороне и сжимаем в JPEG
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.85).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

async function addFiles(files) {
  for (const f of files) {
    if (!f.type.startsWith("image/")) continue;
    if (pending.length >= 4) { alert(t("tooMany")); break; }
    try { pending.push(await fileToBase64(f)); } catch (e) {}
  }
  renderThumbs();
  $("input").focus();
}

function renderThumbs() {
  const box = $("thumbs");
  box.innerHTML = "";
  pending.forEach((b64, i) => {
    const d = document.createElement("div");
    d.className = "thumb";
    d.innerHTML = `<img src="data:image/jpeg;base64,${b64}" alt=""><button type="button" title="${t("removeImg")}">×</button>`;
    d.querySelector("button").onclick = () => { pending.splice(i, 1); renderThumbs(); };
    box.appendChild(d);
  });
}

function guideMarkdown(md) {
  const inline = (s) => escapeHtml(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, href) => {
      const g = href.match(/^INSTALL_(RU|EN)\.md$/);
      if (g) return `<a href="#" data-guide-lang="${g[1].toLowerCase()}">${label}</a>`;
      if (/^https?:\/\//.test(href)) return `<a href="${href}" target="_blank" rel="noopener">${label}</a>`;
      return label;
    });
  const lines = md.replace(/\r/g, "").split("\n");
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    const h = l.match(/^(#{1,3})\s+(.*)$/);
    if (!l.trim()) { i++; continue; }
    if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\s*\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const body = rows.filter((r, k) => !(k === 1 && /^[\s|:-]+$/.test(r)));
      const [head, ...rest] = body;
      out.push('<div class="tbl"><table><thead><tr>' + cells(head).map((c) => `<th>${inline(c)}</th>`).join("") +
        "</tr></thead><tbody>" + rest.map((r) => "<tr>" + cells(r).map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") +
        "</tbody></table></div>");
      continue;
    }
    const listRe = /^\s*(\d+[.)]|[-*•])\s+/;
    if (listRe.test(l)) {
      const ordered = /^\s*\d/.test(l);
      const items = [];
      while (i < lines.length && listRe.test(lines[i])) items.push(lines[i++].replace(listRe, ""));
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>` + items.map((it) => `<li>${inline(it)}</li>`).join("") + `</${tag}>`);
      continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,3}\s|\s*\||\s*(\d+[.)]|[-*•])\s)/.test(lines[i])) para.push(lines[i++]);
    out.push(`<p>${para.map(inline).join("<br>")}</p>`);
  }
  return out.join("\n");
}

function speechText(md) {
  return md.replace(/```[\s\S]*?```/g, " ").replace(/`([^`]+)`/g, "$1").replace(/\*\*([^*]+)\*\*/g, "$1")
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/^#{1,6}\s*/gm, "").replace(/^\s*[-*•]\s+/gm, "")
    .replace(/\|/g, " ").replace(/[✅]/g, ". ").replace(/[❌]/g, ". ").replace(/[⬇🖼⭐]/gu, "").replace(/_{2,}/g, " … ");
}
function voiceLang(text) {
  if (/[一-鿿]/.test(text)) return "zh";
  if (/[а-яё]/i.test(text)) return "ru";
  if (/[äöüß]/i.test(text)) return "de";
  if (/[éèêàçùûœîï]/i.test(text)) return "fr";
  return /[a-z]/i.test(text) ? "en" : lang;
}
function pickVoice(code) {
  const voices = speechSynthesis.getVoices().filter((v) => v.lang.toLowerCase().startsWith(code));
  return voices.find((v) => v.localService && /premium|enhanced|milena|yuri|siri/i.test(v.name)) || voices.find((v) => v.localService) || voices[0] || null;
}
function setSayButton(b, on) {
  if (!b) return;
  b.classList.toggle("on", on);
  b.querySelector("span").textContent = t(on ? "sayStop" : "say");
}
function stopSpeaking() {
  speechSynthesis.cancel();
  setSayButton(tts.btn, false);
  tts.btn = null;
}
function speak(md, btn) {
  if (!("speechSynthesis" in window)) return;
  stopSpeaking();
  // по предложениям: так длинный ответ не обрывается, а английские примеры читает английский голос
  const parts = speechText(md).split(/(?<=[.!?。！？:;\n])\s+/).map((p) => p.trim()).filter((p) => /[\p{L}\p{N}]/u.test(p));
  if (!parts.length) return;
  tts.btn = btn || null;
  setSayButton(tts.btn, true);
  parts.forEach((part, i) => {
    const u = new SpeechSynthesisUtterance(part);
    const code = voiceLang(part);
    const v = pickVoice(code);
    if (v) u.voice = v;
    u.lang = v ? v.lang : code;
    u.rate = 1.0;
    if (i === parts.length - 1) u.onend = () => { if (tts.btn === (btn || null)) { setSayButton(tts.btn, false); tts.btn = null; } };
    speechSynthesis.speak(u);
  });
}
if ("speechSynthesis" in window) speechSynthesis.getVoices(); // голоса подгружаются асинхронно
else $("speakToggle").closest("label").hidden = true;

// ---------- голос: распознавание (Whisper на компьютере) ----------
const mic = { rec: null, stream: null, chunks: [], timer: null, started: 0 };
function micError(text) { addMessage("error", text); }
function setMicState(st) {
  const b = $("micBtn");
  b.classList.toggle("rec", st === "rec");
  b.classList.toggle("busy", st === "busy");
  b.title = t(st === "rec" ? "micStop" : "mic"); b.setAttribute("aria-label", b.title);
  if (st !== "rec") $("recTime").textContent = "";
}
$("micBtn").onclick = async () => {
  if (mic.rec) { mic.rec.stop(); return; }
  if ($("micBtn").classList.contains("busy") || state.busy) return;
  if (!window.isSecureContext || !navigator.mediaDevices || !window.MediaRecorder) { micError(t("micInsecure")); return; }
  try { mic.stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { micError(t("micDenied")); return; }
  stopSpeaking();
  const type = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg;codecs=opus"].find((x) => MediaRecorder.isTypeSupported(x)) || "";
  mic.chunks = [];
  mic.rec = new MediaRecorder(mic.stream, type ? { mimeType: type } : {});
  mic.rec.ondataavailable = (e) => { if (e.data.size) mic.chunks.push(e.data); };
  mic.rec.onstop = () => {
    clearInterval(mic.timer);
    mic.stream.getTracks().forEach((tr) => tr.stop());
    const blob = new Blob(mic.chunks, { type: mic.rec.mimeType || type || "audio/webm" });
    mic.rec = null;
    transcribeAudio(blob);
  };
  mic.rec.start();
  mic.started = Date.now();
  setMicState("rec");
  mic.timer = setInterval(() => {
    const sec = Math.floor((Date.now() - mic.started) / 1000);
    $("recTime").textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
    if (sec >= 120 && mic.rec) mic.rec.stop(); // не больше 2 минут за раз
  }, 250);
};
async function transcribeAudio(blob) {
  if (blob.size < 1000) { setMicState(""); micError(t("sttEmpty")); return; }
  setMicState("busy");
  const input = $("input");
  const oldPh = input.placeholder;
  input.placeholder = t("transcribing");
  const slow = setTimeout(() => { input.placeholder = t("sttSlow"); }, 8000);
  const ext = blob.type.includes("mp4") ? "m4a" : blob.type.includes("ogg") ? "ogg" : "webm";
  const fd = new FormData();
  fd.append("audio", blob, "voice." + ext);
  try {
    const res = await fetch("/transcribe", { method: "POST", body: fd });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) { showLogin(); return; }
    if (!res.ok) {
      const c = data.detail && data.detail.code;
      micError(c === "stt_missing" ? t("sttMissing") : t("sttFailed") + ((data.detail && data.detail.error) || data.detail || res.status));
      return;
    }
    const text = (data.text || "").trim();
    if (!text) { micError(t("sttEmpty")); return; }
    if ($("speakToggle").checked && !pending.length) {
      send(text); // режим разговора: сказала → Lumelle отвечает вслух
    } else {
      input.value = (input.value ? input.value + " " : "") + text;
      input.dispatchEvent(new Event("input"));
      input.focus();
    }
  } catch (e) {
    micError(t("sttFailed") + e.message);
  } finally {
    clearTimeout(slow);
    input.placeholder = oldPh;
    setMicState("");
  }
}

    const { models } = await api(`/cloud/${pid}/models`);
    const list = models.includes(current) ? models : [current, ...models];
    card.querySelector("[data-model]").innerHTML = list.map((m) => `<option${m === current ? " selected" : ""}>${escapeHtml(m)}</option>`).join("");
  } catch (e) { card.querySelector(".msg").textContent = t("cloudNoNet") + " " + e.message; }
}
$("cloudList").addEventListener("click", async (e) => {
  const card = e.target.closest(".cloud-card"); if (!card) return;
  const pid = card.dataset.p, msg = card.querySelector(".msg");
  if (e.target.closest("[data-save]")) {
    const key = card.querySelector("[data-key]").value.trim(); if (!key) return;
    msg.textContent = t("cloudChecking");
    try { await api("/cloud", { method: "POST", body: { provider: pid, key } }); await renderCloud();
      document.querySelector(`.cloud-card[data-p="${pid}"] .msg`).textContent = t("cloudOk"); loadModels(); }
    catch (err) { msg.textContent = err.message; }
  } else if (e.target.closest("[data-remove]")) {
    if (!confirm(t("cloudConfirmDel").replace("{name}", card.querySelector("b").textContent))) return;
    await api("/cloud", { method: "POST", body: { provider: pid, key: "" } }); await renderCloud(); loadModels();
  }
});
$("cloudList").addEventListener("change", async (e) => {
  const sel = e.target.closest("[data-model]"); if (!sel) return;
  const pid = sel.closest(".cloud-card").dataset.p;
  try { await api("/cloud", { method: "POST", body: { provider: pid, model: sel.value } }); loadModels(); }
  catch (err) { sel.closest(".cloud-card").querySelector(".msg").textContent = err.message; }
});
$("cloudClose").onclick = () => $("cloudDlg").classList.remove("open");
$("cloudDlg").addEventListener("click", (e) => { if (e.target === $("cloudDlg")) $("cloudDlg").classList.remove("open"); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("cloudDlg").classList.remove("open"); });

// ---------- документы ----------
let docsCache = [];
function docErr(err) {
  const c = err.detail && err.detail.code;
  return { doc_type: t("docErrType"), doc_big: t("docErrBig"), doc_read: t("docErrRead"), doc_empty: t("docErrEmpty") }[c] || err.message;
}
const ALL = "__all", NEW = "__new";
let docFolder = ALL;  // папка, открытая в окне «Документы»
function folders() { return [...new Set(docsCache.map((d) => d.collection).filter(Boolean))].sort((a, b) => a.localeCompare(b)); }
function folderOptions(withAll, withNew, selected) {
  const hasLoose = docsCache.some((d) => !d.collection);
  const opts = (withAll ? [[ALL, t("colAll")]] : []).concat(folders().map((f) => [f, f]))
    .concat(hasLoose || !withAll ? [["", t("colNone")]] : []).concat(withNew ? [[NEW, t("colNew")]] : []);
  return opts.map(([v, l]) => `<option value="${escapeHtml(v)}"${v === selected ? " selected" : ""}>${escapeHtml(l)}</option>`).join("");
}
function askFolder() {
  const name = (prompt(t("colPrompt")) || "").trim().replace(/\s+/g, " ").slice(0, 60);
  return name || null;
}
async function loadDocs() {
  try { docsCache = await api("/documents"); } catch (e) { docsCache = []; }
  $("docsBtn").hidden = !me;
  $("docsCount").textContent = docsCache.length || "";
  $("useDocsLbl").hidden = !docsCache.length;
  // выбор папки внизу экрана — только если папки есть
  const fs = folders();
  let pick = "";
  try { pick = localStorage.getItem("lumelle-docs-col") ?? ALL; } catch (e) { pick = ALL; }
  if (pick !== ALL && pick !== "" && !fs.includes(pick)) pick = ALL;
  $("docsCol").innerHTML = folderOptions(true, false, pick);
  $("docsCol").hidden = !fs.length;
  $("strictLbl").hidden = !$("useDocs").checked;
  renderDocList();
}
function renderDocList() {
  const known = folders();
  const opts = folderOptions(true, true, docFolder);
  $("docColSel").innerHTML = docFolder !== ALL && docFolder !== "" && !known.includes(docFolder)
    ? opts.replace(`<option value="${NEW}"`, `<option value="${escapeHtml(docFolder)}" selected>${escapeHtml(docFolder)}</option><option value="${NEW}"`) : opts;
  const list = docsCache.filter((d) => docFolder === ALL || d.collection === docFolder);
  $("docList").innerHTML = list.length
    ? list.map((d) => `<div class="doc-row" data-doc="${d.id}"><span class="nm" title="${escapeHtml(d.name)}">${escapeHtml(d.name)}</span>` +
        `<select data-move="${d.id}" title="${t("colLabel")}">${folderOptions(false, true, d.collection)}</select>` +
        `<span class="meta">${t("docsParts").replace("{n}", d.parts)}</span><button data-del-doc="${d.id}">${t("delUser")}</button></div>`).join("")
    : `<div class="doc-empty">${t("docsEmpty")}</div>`;
}
async function loadDocStatus() {
  let st;
  try { st = await api("/documents/status"); } catch (e) { $("docSem").textContent = ""; return; }
  const box = $("docSem");
  box.classList.toggle("on", st.semantic);
  box.innerHTML = st.semantic
    ? escapeHtml(t("semOn")) + (st.missing ? " " + escapeHtml(t("semPrep").replace("{n}", st.missing)) : "")
    : escapeHtml(t("semOff")) + `<br><code>ollama pull ${escapeHtml(st.model)}</code>`;
}
$("docColSel").onchange = async () => {
  let v = $("docColSel").value;
  if (v === NEW) { v = askFolder(); if (v === null) { renderDocList(); return; } }
  docFolder = v; renderDocList();
};
$("docList").addEventListener("change", async (e) => {
  const sel = e.target.closest("[data-move]"); if (!sel) return;
  let v = sel.value;
  if (v === NEW) { v = askFolder(); if (v === null) { renderDocList(); return; } }
  try { await api(`/documents/${sel.dataset.move}`, { method: "PATCH", body: { collection: v } }); await loadDocs(); }
  catch (err) { $("docMsg").textContent = err.message; }
});
$("docsCol").onchange = () => { try { localStorage.setItem("lumelle-docs-col", $("docsCol").value); } catch (e) {} };
try { $("strictDocs").checked = localStorage.getItem("lumelle-docs-strict") === "1"; } catch (e) {}
$("strictDocs").onchange = () => { try { localStorage.setItem("lumelle-docs-strict", $("strictDocs").checked ? "1" : "0"); } catch (e) {} };
function docsRequest() {
  const on = !$("useDocsLbl").hidden && $("useDocs").checked;
  const col = $("docsCol").hidden ? ALL : $("docsCol").value;
  return { use_docs: on, collection: on && col !== ALL ? col : null, strict_docs: on && $("strictDocs").checked };
}
try { $("useDocs").checked = localStorage.getItem("lumelle-docs") !== "0"; } catch (e) { $("useDocs").checked = true; }
$("useDocs").onchange = () => { $("strictLbl").hidden = !$("useDocs").checked; try { localStorage.setItem("lumelle-docs", $("useDocs").checked ? "1" : "0"); } catch (e) {} };
$("docsBtn").onclick = () => { $("docMsg").textContent = ""; loadDocs(); loadDocStatus(); $("docsDlg").classList.add("open"); };
$("docsClose").onclick = () => $("docsDlg").classList.remove("open");
$("docsDlg").addEventListener("click", async (e) => {
  if (e.target === $("docsDlg")) { $("docsDlg").classList.remove("open"); return; }
  const b = e.target.closest("[data-del-doc]"); if (!b) return;
  const d = docsCache.find((x) => String(x.id) === b.dataset.delDoc);
  if (!d || !confirm(t("docConfirmDel").replace("{name}", d.name))) return;
  try { await api(`/documents/${d.id}`, { method: "DELETE" }); $("docMsg").textContent = ""; await loadDocs(); }
  catch (err) { $("docMsg").textContent = err.message; }
});
async function uploadDocs(files) {
  for (const f of files) {
    $("docMsg").textContent = t("docUploading") + " " + f.name;
    const fd = new FormData(); fd.append("file", f, f.name); fd.append("collection", docFolder === ALL ? "" : docFolder);
    try {
      const res = await fetch("/documents", { method: "POST", body: fd });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) { showLogin(); return; }
      if (!res.ok) { const err = new Error(typeof data.detail === "string" ? data.detail : res.status); err.detail = data.detail; throw err; }
      $("docMsg").textContent = t("docUploaded").replace("{name}", data.name);
      if (!$("useDocs").checked) { $("useDocs").checked = true; $("useDocs").onchange(); }
    } catch (err) { $("docMsg").textContent = f.name + ": " + docErr(err); }
  }
  await loadDocs();
  loadDocStatus();
}
$("docFile").onchange = () => { uploadDocs([...$("docFile").files]); $("docFile").value = ""; };
["dragenter", "dragover"].forEach((ev) => $("docDrop").addEventListener(ev, (e) => { e.preventDefault(); $("docDrop").classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => $("docDrop").addEventListener(ev, (e) => { e.preventDefault(); $("docDrop").classList.remove("over"); }));
$("docDrop").addEventListener("drop", (e) => uploadDocs([...e.dataTransfer.files]));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("docsDlg").classList.remove("open"); });

// ---------- вход: admin и guest ----------
let me = null;
function showLogin() {
  me = null;
  document.body.classList.add("need-login");
  $("docsBtn").hidden = true; $("useDocsLbl").hidden = true;
  $("meBox").hidden = true;
  $("lgErr").hidden = true;
  setTimeout(() => $("lgName").focus(), 50);
}
function setUser(u) {
  me = u;
  document.body.classList.remove("need-login");
  $("meBox").hidden = false;
  $("meAvatar").textContent = u.name[0].toUpperCase();
  $("meName").textContent = u.name;
  $("meRole").textContent = t(u.role === "admin" ? "roleAdmin" : u.role === "guest" ? "roleGuest" : "roleUser");
  $("pwBtn").hidden = u.role !== "admin";
  if (u.must_change) askOwnPassword();
  loadModels();
  loadDocs();
  loadCommands();
}
$("loginLang").innerHTML = $("langSel").innerHTML;
$("loginLang").onchange = () => { $("langSel").value = $("loginLang").value; $("langSel").onchange(); };
$("lgShow").onclick = () => {
  const p = $("lgPass"); p.type = p.type === "password" ? "text" : "password";
  $("lgShow").textContent = t(p.type === "password" ? "show" : "hide");
};
$("loginForm").onsubmit = async (e) => {
  e.preventDefault();
  $("lgGo").disabled = true; $("lgErr").hidden = true;
  try {
    const u = await api("/login", { method: "POST", body: { name: $("lgName").value, password: $("lgPass").value, remember: $("lgRemember").checked } });
    $("lgPass").value = "";
    setUser(u);
    state.current = null;
    await loadChats();
    newChat();
  } catch (err) {
    const d = err.detail || {};
    $("lgErr").textContent = d.code === "locked" ? t("locked").replace("{m}", Math.ceil(d.seconds / 60))
      : d.code === "wrong" ? t("wrong").replace("{n}", d.left) : err.message;
    $("lgErr").hidden = false;
  } finally { $("lgGo").disabled = false; }
};
$("logoutBtn").onclick = async () => {
  try { await api("/logout", { method: "POST" }); } catch (e) {}
  state.chats = []; state.current = null; renderChatList(); newChat();
  showLogin();
};
function errText(err) {
  const c = err.detail && err.detail.code;
  return c === "taken" ? t("errTaken") : c === "bad_name" ? t("errBadName") : c === "short" ? t("pwShort") : err.message;
}
async function renderUsers() {
  const [users, meInfo] = await Promise.all([api("/users"), api("/me")]);
  $("pwWeak").hidden = !(meInfo.default_passwords || []).length;
  const role = (r) => t(r === "admin" ? "roleAdmin" : r === "guest" ? "roleGuest" : "roleUser");
  $("usersList").innerHTML = `<div class="u-row head"><span>${t("colName")}</span><span>${t("colRole")}</span><span>${t("colChats")}</span><span></span><span></span><span></span></div>` +
    users.map((u) => `<div class="u-row" data-user="${escapeHtml(u.name)}"><b>${escapeHtml(u.name)}</b><span class="u-role ${u.role === "admin" ? "admin" : ""}">${role(u.role)}</span><span>${u.chats}</span>` +
      `<input type="password" placeholder="${t("newPwPh")}" autocomplete="new-password"><button data-act="pw">${t("save")}</button>` +
      `<button class="del" data-act="del" ${u.role === "admin" ? "disabled" : ""}>${t("delUser")}</button></div>`).join("");
}
async function openPw() {
  $("pwMsg").textContent = "";
  $("pwDlg").classList.add("open");
  try { await renderUsers(); } catch (e) { $("pwMsg").textContent = e.message; }
}
$("pwBtn").onclick = openPw;
$("pwClose").onclick = () => $("pwDlg").classList.remove("open");
$("pwDlg").addEventListener("click", async (e) => {
  if (e.target === $("pwDlg")) { $("pwDlg").classList.remove("open"); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const row = b.closest("[data-user]"); const name = row.dataset.user;
  try {
    if (b.dataset.act === "pw") {
      const input = row.querySelector("input");
      await api("/users/password", { method: "POST", body: { name, password: input.value } });
      input.value = ""; $("pwMsg").textContent = `${name}: ${t("saved")}`;
    } else {
      if (!confirm(t("confirmUserDel").replace("{name}", name))) return;
      await api(`/users/${encodeURIComponent(name)}`, { method: "DELETE" });
      $("pwMsg").textContent = "";
    }
    await renderUsers();
  } catch (err) { $("pwMsg").textContent = errText(err); }
});
$("addUser").onsubmit = async (e) => {
  e.preventDefault();
  try {
    const r = await api("/users", { method: "POST", body: { name: $("auName").value, password: $("auPass").value } });
    $("auName").value = ""; $("auPass").value = "";
    $("pwMsg").textContent = t("added").replace("{name}", r.name);
    await renderUsers();
  } catch (err) { $("pwMsg").textContent = errText(err); }
};
function askOwnPassword() { $("mustMsg").textContent = ""; $("mustPass").value = ""; $("mustDlg").classList.add("open"); setTimeout(() => $("mustPass").focus(), 50); }
$("mustForm").onsubmit = async (e) => {
  e.preventDefault();
  try {
    await api("/me/password", { method: "POST", body: { password: $("mustPass").value } });
    $("mustDlg").classList.remove("open");
  } catch (err) { $("mustMsg").textContent = errText(err); }
};
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("pwDlg").classList.remove("open"); });

// ---------- старт ----------
applyLang();
newChat();
api("/me").then((u) => { setUser(u); return loadChats(); }).catch(() => {});
</script>
</body>
</html>
