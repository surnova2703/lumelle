<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumo AI</title>
<style>
  :root {
    --bg: #F6F3EC;
    --panel: #FFFDF8;
    --ink: #14162B;
    --muted: #6B6E85;
    --line: #E4DFD3;
    --side: #14162B;
    --side-ink: #E9E7F2;
    --side-muted: #9A9CB8;
    --side-hover: #22254A;
    --accent: #F2B45A;
    --accent-ink: #14162B;
    --user: #14162B;
    --user-ink: #F6F3EC;
    --bot: #FFFDF8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1124;
      --panel: #181B35;
      --ink: #ECEAF4;
      --muted: #9A9CB8;
      --line: #2A2D4D;
      --side: #0B0D1C;
      --side-hover: #1C1F3D;
      --user: #F2B45A;
      --user-ink: #14162B;
      --bot: #1C1F3D;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
    display: grid; grid-template-columns: 280px 1fr;
  }

  /* ---------- боковая панель ---------- */
  aside {
    background: var(--side); color: var(--side-ink);
    display: flex; flex-direction: column; min-height: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 20px 20px 12px; font-weight: 700; font-size: 20px; }
  .orb { width: 22px; height: 22px; border-radius: 50%;
         background: radial-gradient(circle, #FFF4DD 0 25%, #F2B45A 55%, rgba(242,180,90,0) 72%); }
  .new-chat {
    margin: 4px 16px 12px; padding: 11px 14px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer;
  }
  .new-chat:hover { filter: brightness(1.05); }
  .chat-list { list-style: none; margin: 0; padding: 0 8px 16px; overflow-y: auto; flex: 1; }
  .chat-item {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px;
    cursor: pointer; color: var(--side-ink);
  }
  .chat-item:hover { background: var(--side-hover); }
  .chat-item.active { background: var(--side-hover); box-shadow: inset 3px 0 0 var(--accent); }
  .chat-item .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .chat-item .tag { font-size: 11px; color: var(--side-muted); text-transform: uppercase; letter-spacing: .04em; }
  .chat-item .del { opacity: 0; border: 0; background: none; color: var(--side-muted); cursor: pointer; font-size: 16px; padding: 0 2px; }
  .chat-item:hover .del { opacity: 1; }
  .chat-item .del:hover { color: #FF9C8A; }
  .empty-list { padding: 12px; color: var(--side-muted); font-size: 14px; }

  /* ---------- основная часть ---------- */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header {
    display: flex; align-items: center; gap: 16px; padding: 14px 24px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { flex: 1; margin: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .modes { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .modes button {
    border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px;
    padding: 6px 14px; border-radius: 7px; cursor: pointer;
  }
  .modes button.on { background: var(--ink); color: var(--bg); }
  .menu-btn { display: none; border: 0; background: none; color: var(--ink); font-size: 22px; cursor: pointer; }

  .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 760px; padding: 12px 16px; border-radius: 14px; line-height: 1.5; font-size: 15px; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-ink); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.assistant { align-self: flex-start; background: var(--bot); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.assistant p { margin: 0 0 8px; } .msg.assistant p:last-child { margin: 0; }
  .msg.assistant pre { background: var(--bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
  .msg.assistant code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }
  .msg.assistant ul, .msg.assistant ol { margin: 4px 0 8px; padding-left: 22px; }
  .msg.error { align-self: flex-start; background: #FBE3DE; color: #7A2414; border: 1px solid #F0B7AA; }
  .typing { align-self: flex-start; color: var(--muted); font-size: 14px; padding: 4px 4px; }
  .typing span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .welcome { margin: auto; text-align: center; color: var(--muted); max-width: 420px; }
  .welcome .big-orb { width: 96px; height: 96px; margin: 0 auto 18px; border-radius: 50%;
    background: radial-gradient(circle, #FFF4DD 0 22%, #F2B45A 50%, rgba(242,180,90,0) 72%); }
  .welcome h2 { color: var(--ink); margin: 0 0 6px; font-size: 24px; }

  .composer { padding: 14px 24px 20px; border-top: 1px solid var(--line); background: var(--panel); }
  .composer form { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; max-height: 200px; min-height: 46px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink);
    font: inherit; font-size: 15px; line-height: 1.4; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .send {
    height: 46px; padding: 0 20px; border: 0; border-radius: 12px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600;
  }
  .send:disabled { opacity: .5; cursor: default; }
  .options { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .options label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 auto 0 0; width: 280px; z-index: 10; transform: translateX(-100%); transition: transform .2s; }
    body.menu-open aside { transform: none; }
    .menu-btn { display: block; }
    header { padding: 12px 16px; gap: 10px; }
    .modes button { padding: 6px 10px; }
    .messages, .composer { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand"><div class="orb"></div>Lumo AI</div>
  <button class="new-chat" id="newChat">+ Новый чат</button>
  <ul class="chat-list" id="chatList"></ul>
</aside>

<main>
  <header>
    <button class="menu-btn" id="menuBtn" aria-label="Список чатов">☰</button>
    <h1 id="chatTitle">Новый чат</h1>
    <div class="modes" id="modes">
      <button data-mode="chat" class="on">Chat</button>
      <button data-mode="write">Write</button>
      <button data-mode="translate">Translate</button>
    </div>
  </header>

  <div class="messages" id="messages"></div>

  <div class="composer">
    <form id="form">
      <textarea id="input" rows="1" placeholder="Напиши сообщение…  (Enter — отправить, Shift+Enter — новая строка)"></textarea>
      <button class="send" id="send" type="submit">Отправить</button>
    </form>
    <div class="options">
      <label><input type="checkbox" id="think"> Думать перед ответом (дольше, но логичнее)</label>
      <span>Работает офлайн</span>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = { chats: [], current: null, mode: "chat", busy: false };

const HINTS = {
  chat: "Задай любой вопрос — я отвечу и запомню контекст этого чата.",
  write: "Опиши, какой текст нужен: письмо, пост, эссе. Укажи тон и длину.",
  translate: "Вставь текст: русский переведу на английский, остальное — на русский.",
};

// ---------- API ----------
async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...options,
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `Ошибка ${res.status}`);
  return data;
}

// ---------- простой markdown для ответов ----------
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function renderMarkdown(text) {
  const blocks = escapeHtml(text).split(/```/);
  return blocks.map((part, i) => {
    if (i % 2 === 1) return `<pre><code>${part.replace(/^\w*\n/, "")}</code></pre>`;
    return part.trim().split(/\n{2,}/).map((para) => {
      const inline = (s) => s
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
        .replace(/^#{1,6}\s+(.*)$/gm, "<b>$1</b>");
      const lines = para.split("\n");
      if (lines.every((l) => /^\s*[-*•]\s+/.test(l)))
        return "<ul>" + lines.map((l) => `<li>${inline(l.replace(/^\s*[-*•]\s+/, ""))}</li>`).join("") + "</ul>";
      if (lines.every((l) => /^\s*\d+[.)]\s+/.test(l)))
        return "<ol>" + lines.map((l) => `<li>${inline(l.replace(/^\s*\d+[.)]\s+/, ""))}</li>`).join("") + "</ol>";
      return para ? `<p>${inline(para).replace(/\n/g, "<br>")}</p>` : "";
    }).join("");
  }).join("");
}

// ---------- отрисовка ----------
function renderChatList() {
  const list = $("chatList");
  list.innerHTML = "";
  if (!state.chats.length) {
    list.innerHTML = '<li class="empty-list">Чатов пока нет</li>';
    return;
  }
  for (const chat of state.chats) {
    const li = document.createElement("li");
    li.className = "chat-item" + (state.current && chat.id === state.current.id ? " active" : "");
    li.innerHTML = `<span class="title"></span><span class="tag">${chat.mode}</span><button class="del" title="Удалить">×</button>`;
    li.querySelector(".title").textContent = chat.title;
    li.onclick = () => openChat(chat.id);
    li.querySelector(".del").onclick = (e) => { e.stopPropagation(); deleteChat(chat.id); };
    list.appendChild(li);
  }
}

function renderMessages(messages) {
  const box = $("messages");
  box.innerHTML = "";
  if (!messages.length) {
    box.innerHTML = `<div class="welcome"><div class="big-orb"></div><h2>Привет! Я Lumo</h2><p>${HINTS[state.mode]}</p></div>`;
    return;
  }
  messages.forEach((m) => addMessage(m.role, m.content, false));
  box.scrollTop = box.scrollHeight;
}

function addMessage(role, content, scroll = true) {
  const box = $("messages");
  box.querySelector(".welcome")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + role;
  if (role === "assistant") div.innerHTML = renderMarkdown(content);
  else div.textContent = content;
  box.appendChild(div);
  if (scroll) box.scrollTop = box.scrollHeight;
  return div;
}

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll("#modes button").forEach((b) => b.classList.toggle("on", b.dataset.mode === mode));
  const welcome = document.querySelector(".welcome p");
  if (welcome) welcome.textContent = HINTS[mode];
}

function setBusy(busy) {
  state.busy = busy;
  $("send").disabled = busy;
  $("send").textContent = busy ? "…" : "Отправить";
}

// ---------- действия ----------
async function loadChats() {
  state.chats = await api("/chats");
  renderChatList();
}

async function openChat(id) {
  const chat = await api(`/chats/${id}`);
  state.current = chat;
  setMode(chat.mode);
  $("chatTitle").textContent = chat.title;
  renderMessages(chat.messages);
  renderChatList();
  document.body.classList.remove("menu-open");
  $("input").focus();
}

function newChat() {
  state.current = null;
  $("chatTitle").textContent = "Новый чат";
  renderMessages([]);
  renderChatList();
  document.body.classList.remove("menu-open");
  $("input").focus();
}

async function deleteChat(id) {
  if (!confirm("Удалить этот чат?")) return;
  await api(`/chats/${id}`, { method: "DELETE" });
  if (state.current && state.current.id === id) newChat();
  await loadChats();
}

async function send(text) {
  setBusy(true);
  addMessage("user", text);
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.innerHTML = "<span></span><span></span><span></span> Lumo думает…";
  $("messages").appendChild(typing);
  $("messages").scrollTop = $("messages").scrollHeight;

  try {
    if (!state.current) {
      const created = await api("/chats", { method: "POST", body: { mode: state.mode } });
      state.current = { id: created.id, mode: state.mode, title: "Новый чат" };
    }
    const res = await api(`/chats/${state.current.id}/ask`, {
      method: "POST",
      body: { text, think: $("think").checked },
    });
    typing.remove();
    addMessage("assistant", res.answer);
    await loadChats();
    const fresh = state.chats.find((c) => c.id === state.current.id);
    if (fresh) { state.current.title = fresh.title; $("chatTitle").textContent = fresh.title; }
  } catch (err) {
    typing.remove();
    addMessage("error", "Не получилось ответить: " + err.message + ". Проверь, что Ollama запущена.");
  } finally {
    setBusy(false);
    $("input").focus();
  }
}

// ---------- события ----------
$("form").onsubmit = (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || state.busy) return;
  $("input").value = "";
  $("input").style.height = "";
  send(text);
};

$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    $("form").requestSubmit();
  }
});

$("input").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 200) + "px";
});

$("modes").onclick = async (e) => {
  const mode = e.target.dataset.mode;
  if (!mode || mode === state.mode) return;
  setMode(mode);
  if (state.current) {
    await api(`/chats/${state.current.id}`, { method: "PATCH", body: { mode } });
    state.current.mode = mode;
    await loadChats();
  }
};

$("newChat").onclick = newChat;
$("menuBtn").onclick = () => document.body.classList.toggle("menu-open");

// ---------- старт ----------
loadChats().catch(() => {});
newChat();
</script>
</body>
</html>
