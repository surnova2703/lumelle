<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Lumo AI</title>
<style>
  :root {
    --bg: #F6F3EC;
    --panel: #FFFDF8;
    --ink: #14162B;
    --muted: #6B6E85;
    --line: #E4DFD3;
    --side: #14162B;
    --side-ink: #E9E7F2;
    --side-muted: #9A9CB8;
    --side-hover: #22254A;
    --accent: #F2B45A;
    --accent-ink: #14162B;
    --user: #14162B;
    --user-ink: #F6F3EC;
    --bot: #FFFDF8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1124;
      --panel: #181B35;
      --ink: #ECEAF4;
      --muted: #9A9CB8;
      --line: #2A2D4D;
      --side: #0B0D1C;
      --side-hover: #1C1F3D;
      --user: #F2B45A;
      --user-ink: #14162B;
      --bot: #1C1F3D;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
    height: 100vh; height: 100dvh; overflow: hidden;
    display: grid; grid-template-columns: 280px minmax(0, 1fr);
  }
  body.side-closed { grid-template-columns: minmax(0, 1fr); }
  body.side-closed aside { display: none; }

  /* ---------- боковая панель ---------- */
  aside {
    background: var(--side); color: var(--side-ink);
    display: flex; flex-direction: column; min-height: 0;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 20px 12px 12px 20px; font-weight: 700; font-size: 20px; }
  .brand .name { flex: 1; }
  .icon-btn {
    width: 36px; height: 36px; flex: none; display: grid; place-items: center;
    border: 0; border-radius: 8px; background: none; color: inherit; cursor: pointer;
  }
  .icon-btn:hover { background: var(--side-hover); }
  .icon-btn svg { width: 20px; height: 20px; }
  .scrim { display: none; }
  .orb { width: 22px; height: 22px; border-radius: 50%;
         background: radial-gradient(circle, #FFF4DD 0 25%, #F2B45A 55%, rgba(242,180,90,0) 72%); }
  .new-chat {
    margin: 4px 16px 12px; padding: 11px 14px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer;
  }
  .new-chat:hover { filter: brightness(1.05); }
  .chat-list { list-style: none; margin: 0; padding: 0 8px 16px; overflow-y: auto; flex: 1; }
  .chat-item {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px;
    cursor: pointer; color: var(--side-ink);
  }
  .chat-item:hover { background: var(--side-hover); }
  .chat-item.active { background: var(--side-hover); box-shadow: inset 3px 0 0 var(--accent); }
  .chat-item .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .chat-item .tag { font-size: 11px; color: var(--side-muted); text-transform: uppercase; letter-spacing: .04em; }
  .chat-item .del { opacity: 0; border: 0; background: none; color: var(--side-muted); cursor: pointer; font-size: 16px; padding: 0 2px; }
  .chat-item:hover .del { opacity: 1; }
  .chat-item .del:hover { color: #FF9C8A; }
  .empty-list { padding: 12px; color: var(--side-muted); font-size: 14px; }
  .lang { margin: 8px 16px 16px; padding: 8px 12px; border: 1px solid var(--side-hover); border-radius: 8px; background: none; color: var(--side-muted); font: inherit; font-size: 13px; cursor: pointer; text-align: left; }
  .lang:hover { color: var(--side-ink); background: var(--side-hover); }

  /* ---------- основная часть ---------- */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header {
    display: flex; align-items: center; gap: 16px; padding: 14px 24px;
    padding-top: max(14px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { flex: 1; margin: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .modes { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .modes button {
    border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px;
    padding: 6px 14px; border-radius: 7px; cursor: pointer;
  }
  .modes button.on { background: var(--ink); color: var(--bg); }
  .menu-btn { display: none; color: var(--ink); margin-left: -8px; }
  .menu-btn:hover { background: var(--bg); }
  body.side-closed .menu-btn { display: grid; }

  .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: min(760px, 88%); padding: 12px 16px; border-radius: 14px; line-height: 1.5; font-size: 15px; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-ink); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.assistant { align-self: flex-start; background: var(--bot); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.assistant p { margin: 0 0 8px; } .msg.assistant p:last-child { margin: 0; }
  .msg.assistant pre { background: var(--bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
  .msg.assistant code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }
  .msg.assistant ul, .msg.assistant ol { margin: 4px 0 8px; padding-left: 22px; }
  .msg.error { align-self: flex-start; background: #FBE3DE; color: #7A2414; border: 1px solid #F0B7AA; }
  .typing { align-self: flex-start; color: var(--muted); font-size: 14px; padding: 4px 4px; }
  .typing span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .welcome { margin: auto; text-align: center; color: var(--muted); max-width: 420px; }
  .welcome .big-orb { width: 96px; height: 96px; margin: 0 auto 18px; border-radius: 50%;
    background: radial-gradient(circle, #FFF4DD 0 22%, #F2B45A 50%, rgba(242,180,90,0) 72%); }
  .welcome h2 { color: var(--ink); margin: 0 0 6px; font-size: 24px; }
  .welcome .pres { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }
  .welcome .pres a {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    font-size: 14px; font-weight: 600; text-decoration: none;
  }
  .welcome .pres a:hover { border-color: var(--accent); }
  .welcome .pres a.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .welcome .pres svg { width: 18px; height: 18px; flex: none; }
  .welcome .pres button { font: inherit; cursor: pointer; }
  .welcome .pres .pbtn {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 14px; font-weight: 600;
  }
  .welcome .pres .pbtn:hover { border-color: var(--accent); }
  .welcome .pres .pbtn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* ---------- выбор языка презентации ---------- */
  .chooser { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(10,12,28,.55); }
  .chooser.open { display: flex; }
  .chooser-box {
    width: min(380px, 100%); background: var(--panel); color: var(--ink); border-radius: 18px; padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35); position: relative;
  }
  .chooser-box h3 { margin: 0 0 4px; font-size: 20px; }
  .chooser-box p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .chooser-box .close-x { position: absolute; top: 12px; right: 12px; color: var(--muted); }
  .chooser-box .close-x:hover { background: var(--bg); }
  .lang-opt {
    width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin-bottom: 10px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink);
    font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; text-align: left;
  }
  .lang-opt:hover { border-color: var(--accent); }
  .lang-opt .code { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--accent); font-size: 13px; font-weight: 700; flex: none; }
  .lang-opt .sub { display: block; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .tech-link { display: block; margin-top: 6px; padding: 6px 0 0; border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .tech-link:hover { color: var(--ink); }

  /* ---------- просмотр презентаций ---------- */
  .viewer {
    position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column;
    background: rgba(8, 9, 20, .97); color: #F6F3EC;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .viewer.open { display: flex; }
  .viewer-bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
  .viewer-bar .vtitle { flex: 1; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .viewer-bar .count { font-size: 14px; color: #B8BAD0; font-variant-numeric: tabular-nums; }
  .viewer-bar a { color: #F2B45A; font-size: 14px; text-decoration: none; white-space: nowrap; }
  .viewer-bar a:hover { text-decoration: underline; }
  .viewer .icon-btn:hover { background: rgba(255,255,255,.1); }
  .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 16px; touch-action: pan-y; }
  .stage img {
    max-width: calc(100% - 120px); max-height: 100%; aspect-ratio: 16 / 9; min-width: 0; width: auto; height: auto; object-fit: contain;
    border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.5); background: #14162B; user-select: none; -webkit-user-drag: none;
  }
  .nav {
    flex: none; width: 48px; height: 48px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255,255,255,.1); color: #F6F3EC; display: grid; place-items: center;
  }
  .nav:hover { background: rgba(242,180,90,.9); color: #14162B; }
  .nav:disabled { opacity: .25; cursor: default; background: rgba(255,255,255,.1); color: #F6F3EC; }
  .nav svg { width: 22px; height: 22px; }
  .dots { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; padding: 14px 16px 18px; }
  .dots button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; background: rgba(255,255,255,.3); cursor: pointer; }
  .dots button.on { background: #F2B45A; width: 22px; border-radius: 4px; }
  @media (max-width: 760px) {
    .stage { padding: 0 8px; }
    .stage img { max-width: 100%; }
    .nav { display: none; }
    .viewer-bar a .long { display: none; }
  }

  .composer { padding: 14px 24px max(20px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--panel); }
  .composer form { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; max-height: 200px; min-height: 46px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink);
    font: inherit; font-size: 15px; line-height: 1.4; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .attach {
    width: 46px; height: 46px; flex: none; display: grid; place-items: center; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--muted);
  }
  .attach:hover { color: var(--ink); border-color: var(--accent); }
  .attach svg { width: 22px; height: 22px; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .thumbs:empty { display: none; }
  .thumb { position: relative; width: 64px; height: 64px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
  .thumb button {
    position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--ink); color: var(--bg); font-size: 14px; line-height: 22px; padding: 0;
  }
  .composer.drag textarea { border-color: var(--accent); border-style: dashed; }
  .msg-images { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .msg-images img { max-width: 220px; max-height: 220px; border-radius: 10px; cursor: zoom-in; display: block; }
  .msg.user .msg-images:last-child { margin-bottom: 0; }
  .lightbox { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(8,9,20,.92); cursor: zoom-out; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .send {
    height: 46px; padding: 0 20px; border: 0; border-radius: 12px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600;
  }
  .send:disabled { opacity: .5; cursor: default; }
  .send-icon { display: none; width: 22px; height: 22px; }
  .options { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .options label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

  @media (max-width: 760px) {
    body, body.side-closed { grid-template-columns: minmax(0, 1fr); }
    aside, body.side-closed aside {
      display: flex; position: fixed; inset: 0 auto 0 0; width: min(300px, 85vw); z-index: 10;
      transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.3);
    }
    body.menu-open aside { transform: none; }
    body.menu-open .scrim { display: block; position: fixed; inset: 0; z-index: 9; background: rgba(10,12,28,.45); }
    .menu-btn, body.side-closed .menu-btn { display: grid; }
    header { padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top)); gap: 8px; }
    header h1 { font-size: 15px; }
    .modes button { padding: 6px 9px; font-size: 13px; }
    .messages { padding: 16px 12px; }
    .composer { padding-left: 12px; padding-right: 12px; }
    .msg { max-width: 92%; }
    textarea { font-size: 16px; }
    .send { width: 46px; padding: 0; display: grid; place-items: center; flex: none; }
    .send-label { display: none; }
    .send-icon { display: block; }
  }
  @media (max-width: 420px) {
    header h1 { display: none; }
    .modes { margin-left: auto; }
    .options .offline { display: none; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand"><div class="orb"></div><span class="name">Lumo AI</span>
    <button class="icon-btn" id="closeSide" data-i18n-title="closeSide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="M15 10l-2 2 2 2"/></svg></button>
  </div>
  <button class="new-chat" id="newChat" data-i18n="newChat"></button>
  <ul class="chat-list" id="chatList"></ul>
  <button class="lang" id="langBtn"></button>
</aside>
<div class="scrim" id="scrim"></div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true">
  <div class="viewer-bar">
    <span class="vtitle" id="vTitle"></span>
    <span class="count" id="vCount"></span>
    <a id="vPdf" target="_blank" rel="noopener">PDF<span class="long"> ↗</span></a>
    <button class="icon-btn" id="vClose" data-i18n-title="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="stage" id="stage">
    <button class="nav" id="vPrev" data-i18n-title="prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <img id="vImg" alt="">
    <button class="nav" id="vNext" data-i18n-title="next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <div class="dots" id="vDots"></div>
</div>
<div class="lightbox" id="lightbox"><img id="lightImg" alt=""></div>
<div class="chooser" id="chooser" role="dialog" aria-modal="true" aria-labelledby="chTitle">
  <div class="chooser-box">
    <button class="icon-btn close-x" id="chClose" data-i18n-title="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h3 id="chTitle" data-i18n="chooseTitle"></h3>
    <p data-i18n="chooseSub"></p>
    <button class="lang-opt" data-deck="en"><span class="code">EN</span><span>English<span class="sub">9 slides</span></span></button>
    <button class="lang-opt" data-deck="ru"><span class="code">RU</span><span>Русский<span class="sub">9 слайдов</span></span></button>
    <button class="tech-link" data-deck="tech" data-i18n="presTech"></button>
  </div>
</div>

<main>
  <header>
    <button class="icon-btn menu-btn" id="menuBtn" data-i18n-title="openSide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="M13 10l2 2-2 2"/></svg></button>
    <h1 id="chatTitle"></h1>
    <div class="modes" id="modes">
      <button data-mode="chat" class="on">Chat</button>
      <button data-mode="write">Write</button>
      <button data-mode="translate">Translate</button>
    </div>
  </header>

  <div class="messages" id="messages"></div>

  <div class="composer">
    <div class="thumbs" id="thumbs"></div>
    <form id="form">
      <label class="attach" id="attachBtn" data-i18n-title="attach">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
      </label>
      <textarea id="input" rows="1"></textarea>
      <button class="send" id="send" type="submit"><span class="send-label" data-i18n="send"></span><svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </form>
    <div class="options">
      <label><input type="checkbox" id="think"> <span data-i18n="think"></span></label>
      <span class="offline" data-i18n="offline"></span>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = { chats: [], current: null, mode: "chat", busy: false };

const STRINGS = {
  ru: {
    newChat: "+ Новый чат", newChatTitle: "Новый чат", send: "Отправить", noChats: "Чатов пока нет",
    placeholder: "Напиши сообщение…  (Enter — отправить, Shift+Enter — новая строка)",
    think: "Думать перед ответом (дольше, но логичнее)", offline: "Работает офлайн",
    hello: "Привет! Я Lumo", typing: "Lumo думает…", del: "Удалить", confirmDel: "Удалить этот чат?",
    error: "Не получилось ответить: ", errorHint: ". Проверь, что Ollama запущена.", lang: "🌐 English",
    placeholderShort: "Напиши сообщение…", closeSide: "Скрыть панель", openSide: "Показать чаты",
    presProduct: "О продукте", presTech: "Техническая презентация (RU) →",
    chooseTitle: "Презентация о Lumo", chooseSub: "На каком языке показать?",
    attach: "Прикрепить картинку (или вставь скриншот: Cmd+V)", tooMany: "Можно прикрепить не больше 4 картинок", removeImg: "Убрать",
    close: "Закрыть", prev: "Предыдущий слайд", next: "Следующий слайд", slide: "Слайд",
    hints: {
      chat: "Задай любой вопрос — я отвечу и запомню контекст этого чата.",
      write: "Опиши, какой текст нужен: письмо, пост, эссе. Укажи тон и длину.",
      translate: "Вставь текст: русский переведу на английский, остальное — на русский.",
    },
  },
  en: {
    newChat: "+ New chat", newChatTitle: "New chat", send: "Send", noChats: "No chats yet",
    placeholder: "Type a message…  (Enter to send, Shift+Enter for a new line)",
    think: "Think before answering (slower, but more logical)", offline: "Works offline",
    hello: "Hi! I’m Lumo", typing: "Lumo is thinking…", del: "Delete", confirmDel: "Delete this chat?",
    error: "Couldn’t answer: ", errorHint: ". Check that Ollama is running.", lang: "🌐 Русский",
    placeholderShort: "Type a message…", closeSide: "Hide sidebar", openSide: "Show chats",
    presProduct: "About the product", presTech: "Technical deck (Russian) →",
    chooseTitle: "Lumo presentation", chooseSub: "Which language would you like?",
    attach: "Attach an image (or paste a screenshot: Cmd+V)", tooMany: "You can attach up to 4 images", removeImg: "Remove",
    close: "Close", prev: "Previous slide", next: "Next slide", slide: "Slide",
    hints: {
      chat: "Ask me anything — I’ll answer and remember the context of this chat.",
      write: "Describe the text you need: an email, a post, an essay. Add the tone and length.",
      translate: "Paste a text: Russian goes to English, everything else goes to Russian.",
    },
  },
};

function detectLang() {
  try { const saved = localStorage.getItem("lumo-lang"); if (saved) return saved; } catch (e) {}
  return (navigator.language || "en").toLowerCase().startsWith("ru") ? "ru" : "en";
}
let lang = detectLang();
const t = (key) => STRINGS[lang][key];

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-title]").forEach((el) => { el.title = t(el.dataset.i18nTitle); el.setAttribute("aria-label", el.title); });
  $("input").placeholder = window.matchMedia("(max-width: 760px)").matches ? t("placeholderShort") : t("placeholder");
  $("langBtn").textContent = t("lang");
  if (!state.current) $("chatTitle").textContent = t("newChatTitle");
  const welcome = document.querySelector(".welcome");
  if (welcome) welcome.outerHTML = welcomeHtml();
  renderChatList();
}

// ---------- API ----------
async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...options,
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `Ошибка ${res.status}`);
  return data;
}

// ---------- простой markdown для ответов ----------
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function renderMarkdown(text) {
  const blocks = escapeHtml(text).split(/```/);
  return blocks.map((part, i) => {
    if (i % 2 === 1) return `<pre><code>${part.replace(/^\w*\n/, "")}</code></pre>`;
    return part.trim().split(/\n{2,}/).map((para) => {
      const inline = (s) => s
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
        .replace(/^#{1,6}\s+(.*)$/gm, "<b>$1</b>");
      const lines = para.split("\n");
      if (lines.every((l) => /^\s*[-*•]\s+/.test(l)))
        return "<ul>" + lines.map((l) => `<li>${inline(l.replace(/^\s*[-*•]\s+/, ""))}</li>`).join("") + "</ul>";
      if (lines.every((l) => /^\s*\d+[.)]\s+/.test(l)))
        return "<ol>" + lines.map((l) => `<li>${inline(l.replace(/^\s*\d+[.)]\s+/, ""))}</li>`).join("") + "</ol>";
      return para ? `<p>${inline(para).replace(/\n/g, "<br>")}</p>` : "";
    }).join("");
  }).join("");
}

// ---------- отрисовка ----------
const DECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg>';
function welcomeHtml() {
  return `<div class="welcome"><div class="big-orb"></div><h2>${t("hello")}</h2><p>${t("hints")[state.mode]}</p>
    <div class="pres">
      <button class="pbtn primary" data-choose>${DECK_ICON}${t("presProduct")}</button>
    </div></div>`;
}
function renderChatList() {
  const list = $("chatList");
  list.innerHTML = "";
  if (!state.chats.length) {
    list.innerHTML = `<li class="empty-list">${t("noChats")}</li>`;
    return;
  }
  for (const chat of state.chats) {
    const li = document.createElement("li");
    li.className = "chat-item" + (state.current && chat.id === state.current.id ? " active" : "");
    li.innerHTML = `<span class="title"></span><span class="tag">${chat.mode}</span><button class="del" title="${t("del")}">×</button>`;
    li.querySelector(".title").textContent = chat.title;
    li.onclick = () => openChat(chat.id);
    li.querySelector(".del").onclick = (e) => { e.stopPropagation(); deleteChat(chat.id); };
    list.appendChild(li);
  }
}

function renderMessages(messages) {
  const box = $("messages");
  box.innerHTML = "";
  if (!messages.length) {
    box.innerHTML = welcomeHtml();
    return;
  }
  messages.forEach((m) => addMessage(m.role, m.content, false, m.images || []));
  box.scrollTop = box.scrollHeight;
}

function addMessage(role, content, scroll = true, images = []) {
  const box = $("messages");
  box.querySelector(".welcome")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + role;
  if (role === "assistant") div.innerHTML = renderMarkdown(content);
  else {
    if (images.length) {
      const wrap = document.createElement("div");
      wrap.className = "msg-images";
      for (const b64 of images) {
        const img = document.createElement("img");
        img.src = "data:image/jpeg;base64," + b64;
        img.alt = "";
        img.onclick = () => { $("lightImg").src = img.src; $("lightbox").classList.add("open"); };
        wrap.appendChild(img);
      }
      div.appendChild(wrap);
    }
    if (content) div.appendChild(document.createTextNode(content));
  }
  box.appendChild(div);
  if (scroll) box.scrollTop = box.scrollHeight;
  return div;
}

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll("#modes button").forEach((b) => b.classList.toggle("on", b.dataset.mode === mode));
  const welcome = document.querySelector(".welcome p");
  if (welcome) welcome.textContent = t("hints")[mode];
}

function setBusy(busy) {
  state.busy = busy;
  $("send").disabled = busy;
  $("send").querySelector(".send-label").textContent = busy ? "…" : t("send");
  $("send").title = t("send");
}

// ---------- действия ----------
async function loadChats() {
  state.chats = await api("/chats");
  renderChatList();
}

async function openChat(id) {
  const chat = await api(`/chats/${id}`);
  state.current = chat;
  setMode(chat.mode);
  $("chatTitle").textContent = chat.title;
  renderMessages(chat.messages);
  renderChatList();
  document.body.classList.remove("menu-open");
  $("input").focus();
}

function newChat() {
  state.current = null;
  $("chatTitle").textContent = t("newChatTitle");
  renderMessages([]);
  renderChatList();
  document.body.classList.remove("menu-open");
  $("input").focus();
}

async function deleteChat(id) {
  if (!confirm(t("confirmDel"))) return;
  await api(`/chats/${id}`, { method: "DELETE" });
  if (state.current && state.current.id === id) newChat();
  await loadChats();
}

async function send(text, images = []) {
  setBusy(true);
  addMessage("user", text, true, images);
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.innerHTML = "<span></span><span></span><span></span> " + t("typing");
  $("messages").appendChild(typing);
  $("messages").scrollTop = $("messages").scrollHeight;

  try {
    if (!state.current) {
      const created = await api("/chats", { method: "POST", body: { mode: state.mode } });
      state.current = { id: created.id, mode: state.mode, title: "New chat" };
    }
    const res = await api(`/chats/${state.current.id}/ask`, {
      method: "POST",
      body: { text, images, think: $("think").checked },
    });
    typing.remove();
    addMessage("assistant", res.answer);
    await loadChats();
    const fresh = state.chats.find((c) => c.id === state.current.id);
    if (fresh) { state.current.title = fresh.title; $("chatTitle").textContent = fresh.title; }
  } catch (err) {
    typing.remove();
    addMessage("error", t("error") + err.message + (/not available/i.test(err.message) ? t("errorHint") : ""));
  } finally {
    setBusy(false);
    $("input").focus();
  }
}

// ---------- события ----------
$("form").onsubmit = (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if ((!text && !pending.length) || state.busy) return;
  const images = pending.slice();
  pending = [];
  renderThumbs();
  $("input").value = "";
  $("input").style.height = "";
  send(text, images);
};

// ---------- картинки ----------
let pending = []; // base64 без префикса

// уменьшаем картинку до 1600 px по длинной стороне и сжимаем в JPEG
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.85).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

async function addFiles(files) {
  for (const f of files) {
    if (!f.type.startsWith("image/")) continue;
    if (pending.length >= 4) { alert(t("tooMany")); break; }
    try { pending.push(await fileToBase64(f)); } catch (e) {}
  }
  renderThumbs();
  $("input").focus();
}

function renderThumbs() {
  const box = $("thumbs");
  box.innerHTML = "";
  pending.forEach((b64, i) => {
    const d = document.createElement("div");
    d.className = "thumb";
    d.innerHTML = `<img src="data:image/jpeg;base64,${b64}" alt=""><button type="button" title="${t("removeImg")}">×</button>`;
    d.querySelector("button").onclick = () => { pending.splice(i, 1); renderThumbs(); };
    box.appendChild(d);
  });
}

$("fileInput").onchange = (e) => { addFiles([...e.target.files]); e.target.value = ""; };
$("input").addEventListener("paste", (e) => {
  const files = [...(e.clipboardData?.files || [])].filter((f) => f.type.startsWith("image/"));
  if (files.length) { e.preventDefault(); addFiles(files); }
});
const composer = document.querySelector(".composer");
["dragenter", "dragover"].forEach((ev) => composer.addEventListener(ev, (e) => { e.preventDefault(); composer.classList.add("drag"); }));
["dragleave", "drop"].forEach((ev) => composer.addEventListener(ev, (e) => { e.preventDefault(); composer.classList.remove("drag"); }));
composer.addEventListener("drop", (e) => addFiles([...e.dataTransfer.files]));
$("lightbox").onclick = () => $("lightbox").classList.remove("open");

$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    $("form").requestSubmit();
  }
});

$("input").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 200) + "px";
});

$("modes").onclick = async (e) => {
  const mode = e.target.dataset.mode;
  if (!mode || mode === state.mode) return;
  setMode(mode);
  if (state.current) {
    await api(`/chats/${state.current.id}`, { method: "PATCH", body: { mode } });
    state.current.mode = mode;
    await loadChats();
  }
};

$("newChat").onclick = newChat;
const isMobile = () => window.matchMedia("(max-width: 760px)").matches;
function setSidebar(open) {
  if (isMobile()) {
    document.body.classList.toggle("menu-open", open);
  } else {
    document.body.classList.toggle("side-closed", !open);
    try { localStorage.setItem("lumo-side", open ? "open" : "closed"); } catch (e) {}
  }
}
try { if (localStorage.getItem("lumo-side") === "closed") document.body.classList.add("side-closed"); } catch (e) {}
$("menuBtn").onclick = () => setSidebar(true);
$("closeSide").onclick = () => setSidebar(false);
$("scrim").onclick = () => setSidebar(false);
window.addEventListener("resize", () => {
  if (!isMobile()) document.body.classList.remove("menu-open");
  $("input").placeholder = isMobile() ? t("placeholderShort") : t("placeholder");
});
$("langBtn").onclick = () => {
  lang = lang === "ru" ? "en" : "ru";
  try { localStorage.setItem("lumo-lang", lang); } catch (e) {}
  applyLang();
};

// ---------- просмотр презентаций ----------
const DECKS = {
  en: { title: "Lumo AI — Product presentation", folder: "en", count: 9, pdf: "Lumo_AI_presentation_EN.pdf" },
  ru: { title: "Lumo AI — Презентация о продукте", folder: "ru", count: 9, pdf: "Lumo_AI_presentation_RU.pdf" },
  tech: { title: "Lumo AI — Техническая презентация", folder: "tech", count: 13, pdf: "Lumo_AI_tech_RU.pdf" },
};
const viewer = { deck: null, i: 0 };

function openDeck(key) {
  viewer.deck = DECKS[key];
  viewer.i = 0;
  $("vTitle").textContent = viewer.deck.title;
  $("vPdf").href = `/presentations/${viewer.deck.pdf}`;
  $("vDots").innerHTML = "";
  for (let n = 0; n < viewer.deck.count; n++) {
    const d = document.createElement("button");
    d.setAttribute("aria-label", `${t("slide")} ${n + 1}`);
    d.onclick = () => showSlide(n);
    $("vDots").appendChild(d);
  }
  $("viewer").classList.add("open");
  showSlide(0);
}

function slideSrc(n) { return `/presentations/slides/${viewer.deck.folder}/${n + 1}.jpg`; }

function showSlide(n) {
  const d = viewer.deck;
  if (!d) return;
  viewer.i = Math.max(0, Math.min(d.count - 1, n));
  $("vImg").src = slideSrc(viewer.i);
  $("vImg").alt = `${d.title}: ${t("slide")} ${viewer.i + 1}`;
  $("vCount").textContent = `${viewer.i + 1} / ${d.count}`;
  $("vPrev").disabled = viewer.i === 0;
  $("vNext").disabled = viewer.i === d.count - 1;
  [...$("vDots").children].forEach((b, k) => b.classList.toggle("on", k === viewer.i));
  if (viewer.i + 1 < d.count) new Image().src = slideSrc(viewer.i + 1); // заранее грузим следующий
}

function closeDeck() { $("viewer").classList.remove("open"); viewer.deck = null; }

function openChooser() { $("chooser").classList.add("open"); $("chooser").querySelector(`.lang-opt[data-deck="${lang}"]`)?.focus(); }
function closeChooser() { $("chooser").classList.remove("open"); }
$("messages").addEventListener("click", (e) => { if (e.target.closest("[data-choose]")) openChooser(); });
$("chooser").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-deck]");
  if (btn) { closeChooser(); openDeck(btn.dataset.deck); }
  else if (e.target === $("chooser")) closeChooser();
});
$("chClose").onclick = closeChooser;
$("vPrev").onclick = () => showSlide(viewer.i - 1);
$("vNext").onclick = () => showSlide(viewer.i + 1);
$("vClose").onclick = closeDeck;
$("vImg").onclick = (e) => {
  const r = e.target.getBoundingClientRect();
  showSlide(viewer.i + (e.clientX - r.left < r.width / 3 ? -1 : 1));
};
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("chooser").classList.contains("open")) { closeChooser(); return; }
  if (!viewer.deck) return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); showSlide(viewer.i + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); showSlide(viewer.i - 1); }
  else if (e.key === "Home") showSlide(0);
  else if (e.key === "End") showSlide(viewer.deck.count - 1);
  else if (e.key === "Escape") closeDeck();
});
let touchX = null;
$("stage").addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
$("stage").addEventListener("touchend", (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 40) showSlide(viewer.i + (dx < 0 ? 1 : -1));
  touchX = null;
});

// ---------- старт ----------
applyLang();
loadChats().catch(() => {});
newChat();
</script>
